name: CD Pipeline - Deploy Backend

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag_override:
        description: "Custom Docker image tag (optional, defaults to commit SHA)"
        required: false
        default: ""

permissions:
  id-token: write # Required for requesting the JWT for AWS OIDC authentication
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false # Never cancel an in-flight deployment to avoid inconsistent states

jobs:
  deploy-backend-lambda:
    name: Deploy Backend to AWS Lambda
    runs-on: ubuntu-latest
    # Execute ONLY if CI succeeded on main or if triggered deliberately via workflow_dispatch
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'clausevader-backend' }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'clausevader-backend' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, checkout the exact commit of the triggering run
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine Docker image tag
        id: image-tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag_override }}" ]; then
            TAG="${{ github.event.inputs.image_tag_override }}"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      - name: Configure AWS Credentials (OIDC or Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME || 'arn:aws:iam::575172595786:role/github-actions-deploy-role' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda container image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.TAG }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "🔨 Building Docker container image for linux/amd64 architecture..."
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" \
            -f backend/Dockerfile.lambda \
            backend

          echo "📦 Pushing container images to Amazon ECR..."
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Update AWS Lambda function code
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.TAG }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "⚡ Deploying to Lambda function '$LAMBDA_FUNCTION_NAME' with image: $IMAGE_URI"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_REGION"

      - name: Wait for Lambda function update to complete
        run: |
          echo "⏳ Waiting for Lambda function '$LAMBDA_FUNCTION_NAME' update to reach 'Successful' state..."
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION"
          
          STATUS=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION" \
            --query "LastUpdateStatus" \
            --output text)

          if [ "$STATUS" = "Successful" ]; then
            echo "🎉 Lambda function updated successfully!"
          else
            echo "❌ Lambda function update failed with status: $STATUS"
            REASON=$(aws lambda get-function-configuration \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --region "$AWS_REGION" \
              --query "LastUpdateStatusReason" \
              --output text)
            echo "Failure reason: $REASON"
            exit 1
          fi
